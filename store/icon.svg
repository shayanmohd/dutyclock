<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#C6E62A"/>
      <stop offset="1" stop-color="#9CCB14"/>
    </linearGradient>
    <!-- one gradient field in user space, so the wedge, rim and spokes shade as one piece with no seams -->
    <linearGradient id="tarmac" gradientUnits="userSpaceOnUse" x1="40" y1="24" x2="68" y2="84">
      <stop offset="0" stop-color="#34424A"/>
      <stop offset="1" stop-color="#1D2529"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.4"/>
      <feOffset dy="1.8" result="b"/>
      <feFlood flood-color="#5E7F04" flood-opacity="0.55"/>
      <feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g id="bg">
    <rect width="108" height="108" fill="url(#ground)"/>
  </g>
  <g id="fg">
    <g filter="url(#shadow)" fill="url(#tarmac)">
      <!-- the driving time left: the upper-right rim quarter filled as a solid wedge -->
      <path d="M54 45 L54 24.5 A29.5 29.5 0 0 1 83.5 54 L63 54 A9 9 0 0 0 54 45 Z"/>
      <!-- rim -->
      <path fill-rule="evenodd" d="M54 24.5 A29.5 29.5 0 1 1 53.99 24.5 Z M54 31.5 A22.5 22.5 0 1 0 54.01 31.5 Z"/>
      <!-- three spokes, broad at the hub -->
      <path d="M26 51 L48 49.5 L48 60 L26 57.5 Z"/>
      <path d="M82 51 L60 49.5 L60 60 L82 57.5 Z"/>
      <path d="M49 60 L59 60 L57.5 81 L50.5 81 Z"/>
      <!-- hub as a ring, the horn button showing the ground -->
      <path fill-rule="evenodd" d="M54 44.5 A9.5 9.5 0 1 1 53.99 44.5 Z M54 50.6 A3.4 3.4 0 1 0 54.01 50.6 Z"/>
    </g>
    <!-- highlight edge on the upper left of the rim -->
    <path d="M28.6 45.4 A27 27 0 0 1 45.4 28.6" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1.3" stroke-linecap="round"/>
  </g>
  <g id="mono" fill="#1D2529">
    <path d="M54 45 L54 24.5 A29.5 29.5 0 0 1 83.5 54 L63 54 A9 9 0 0 0 54 45 Z"/>
    <path fill-rule="evenodd" d="M54 24.5 A29.5 29.5 0 1 1 53.99 24.5 Z M54 31.5 A22.5 22.5 0 1 0 54.01 31.5 Z"/>
    <path d="M26 51 L48 49.5 L48 60 L26 57.5 Z"/>
    <path d="M82 51 L60 49.5 L60 60 L82 57.5 Z"/>
    <path d="M49 60 L59 60 L57.5 81 L50.5 81 Z"/>
    <path fill-rule="evenodd" d="M54 44.5 A9.5 9.5 0 1 1 53.99 44.5 Z M54 50.6 A3.4 3.4 0 1 0 54.01 50.6 Z"/>
  </g>
</svg>
