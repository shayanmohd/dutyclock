<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: "Plex Cond"; src: url("fonts/plex_condensed_bold.ttf"); font-weight: 700; }
  @font-face { font-family: "Red Hat Text"; src: url("fonts/red_hat_text_regular.ttf"); font-weight: 400; }
  html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; }
  body {
    position: relative;
    background: linear-gradient(160deg, #C6E62A 0%, #9CCB14 100%);
    font-family: "Plex Cond", sans-serif; color: #1D2529;
  }
  .copy { position: absolute; left: 72px; top: 0; bottom: 0; width: 560px;
          display: flex; flex-direction: column; justify-content: center; }
  .mark { width: 148px; height: 148px; margin: 0 0 22px -6px; }
  h1 { font-size: 120px; line-height: 0.95; margin: 0 0 18px; letter-spacing: -1px; }
  p { font-family: "Red Hat Text", sans-serif; font-size: 32px; line-height: 1.25; margin: 0; max-width: 420px; }
  .phone { position: absolute; left: 700px; top: 48px; width: 262px; height: 480px;
           border: 9px solid #1D2529; border-bottom: 0; border-radius: 38px 38px 0 0;
           overflow: hidden; background: #ECEFEA;
           box-shadow: 0 18px 40px rgba(78, 104, 4, 0.45); }
  .phone img { display: block; width: 100%; }
</style></head>
<body>
  <div class="copy">
    <svg class="mark" viewBox="22 22 64 64" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="tarmac" gradientUnits="userSpaceOnUse" x1="40" y1="24" x2="68" y2="84">
          <stop offset="0" stop-color="#34424A"/><stop offset="1" stop-color="#1D2529"/>
        </linearGradient>
      </defs>
      <g fill="url(#tarmac)">
        <path d="M54 45 L54 24.5 A29.5 29.5 0 0 1 83.5 54 L63 54 A9 9 0 0 0 54 45 Z"/>
        <path fill-rule="evenodd" d="M54 24.5 A29.5 29.5 0 1 1 53.99 24.5 Z M54 31.5 A22.5 22.5 0 1 0 54.01 31.5 Z"/>
        <path d="M26 51 L48 49.5 L48 60 L26 57.5 Z"/>
        <path d="M82 51 L60 49.5 L60 60 L82 57.5 Z"/>
        <path d="M49 60 L59 60 L57.5 81 L50.5 81 Z"/>
        <path fill-rule="evenodd" d="M54 44.5 A9.5 9.5 0 1 1 53.99 44.5 Z M54 50.6 A3.4 3.4 0 1 0 54.01 50.6 Z"/>
      </g>
    </svg>
    <h1>Dutyclock</h1>
    <p>Drivers' hours countdowns for EU and UK rules</p>
  </div>
  <div class="phone"><img src="screenshots-raw/01-today.png" alt=""></div>
</body></html>
